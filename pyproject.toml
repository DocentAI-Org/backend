[project]
name = "docentai-backend"
version = "0.1.0"
description = "Backend API for DocentAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.142.2",
  "pydantic-settings>=2.15.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
