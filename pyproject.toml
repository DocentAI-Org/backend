[project]
name = "docentai-backend"
version = "0.1.0"
description = "Backend API for DocentAI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
