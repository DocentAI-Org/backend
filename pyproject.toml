[project]
name = "docentai-backend"
version = "0.1.0"
description = "Backend API for DocentAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.5.0",
  "cryptography>=50.0.2",
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "openai>=3.46.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.8",
  "pydantic-settings>=2.16.2",
  "pyjwt[crypto]>=2.15.1",
  "pypdf>=6.21.4",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.33",
  "sqlalchemy>=2.1.8",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the local Supabase database (npx supabase start)",
]
