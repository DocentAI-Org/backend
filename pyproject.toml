[project]
name = "docentai-backend"
version = "0.1.0"
description = "Backend API for DocentAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic==2.9.0",
  "cryptography>=50.0.2",
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "openai>=3.46.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.8",
  "pydantic-settings>=2.16.2",
  "pyjwt[crypto]>=2.15.1",
  "pypdf>=6.21.4",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.33",
  "sqlalchemy>=2.1.8",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# S: security (bandit), SIM/RET: simpler code, C90: complexity, ERA: commented-out code.
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RET", "C90", "ERA"]
# Asserts narrow types after a row is read or created; under -O the request still fails.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixtures use fixed passwords, tokens and temporary paths on purpose; table names in
# queries come from the catalogue, and the hook tests run the hooks.
"tests/**" = ["S105", "S106", "S107", "S108", "S311", "S603", "S608"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the local Supabase database (npx supabase start)",
]

[tool.pyright]
include = ["app", "scripts"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# A silenced error that no longer happens is reported, so ignores do not pile up.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# 96 % on 2026-11-19; the integrations with Supabase and Ollama are faked in tests.
fail_under = 95
skip_covered = true
