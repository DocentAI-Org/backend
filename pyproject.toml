[project]
name = "docentai-backend"
version = "0.1.0"
description = "Backend API for DocentAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic==1.9.0",
  "fastapi>=0.142.2",
  "httpx>=0.28.1",
  "openai>=3.37.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.15.0",
  "pyjwt[crypto]>=2.15.1",
  "pypdf>=6.21.2",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.32",
  "sqlalchemy>=2.1.6",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the local Supabase database (npx supabase start)",
    "eval: runs the real model on the evaluation sets; `uv run pytest -m eval -s`",
]
addopts = "-m 'not eval'"
